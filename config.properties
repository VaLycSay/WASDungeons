# WASDungeons fork - configuracao opcional
# Coloque este arquivo na mesma pasta do .jar para customizar.
# Sem este arquivo, valores default abaixo sao usados.

key.up=W
key.left=A
key.down=S
key.right=D
key.pause=P

# Mouse volta ao centro da tela quando voce solta WASD?
#   false = mouse fica onde estiver (recomendado para mira/UI livres)
#   true  = comportamento original do mod (mouse pula pro centro a cada release)
mouse.recenter=false

# Multi-monitor:
#   true  = usa o monitor onde o cursor esta no momento (recomendado)
#   false = usa sempre o monitor primario
monitor.useCurrent=true
